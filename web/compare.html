      "cmp.govt.note": "This is the range for a typical government facility (sample data) — not the actual rate of any hospital listed here.",
      "cmp.th.service": "Service"
    }
  });

  UI.boot("compare");
  document.title = UI.t("cmp.title");

  // Pick the correct record-name field per language (data, not UI chrome).
  function nameOf(r) { return UI.isEn() && r.name_en ? r.name_en : r.name_bn; }
  function nameAlt(r) { return UI.isEn() ? r.name_bn : r.name_en; }

  const params = new URLSearchParams(location.search);
  let currentService = null;
  const selected = new Set();

  // Search box (service/hospital aware)
  document.getElementById("cmp-search").appendChild(UI.searchBox({
    onSelect: (value, type) => { if (type === "hospital") location.href = "hospital.html?slug=" + encodeURIComponent(value); else selectServiceBySlug(value); }
  }));
  if (params.get("q")) {
    const q = params.get("q").toLowerCase();
    const found = DB.services.find((s) => [s.name_bn, s.name_en, s.slug].concat(s.synonyms).some((x) => String(x).toLowerCase().includes(q)));
    if (found) currentService = found;
  }
  if (params.get("service")) {
    const s = DB.services.find((x) => x.slug === params.get("service"));
    if (s) currentService = s;
  }

  // Service quick-chips
  document.getElementById("service-chips").innerHTML = DB.services.map((s) =>
    '<button class="chip" type="button" data-slug="' + s.slug + '" aria-pressed="false">' + Fmt.escapeHtml(nameOf(s)) + "</button>").join("");
  document.getElementById("service-chips").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-slug]"); if (b) selectServiceBySlug(b.dataset.slug);
  });

  function selectServiceBySlug(slug, silent) {
    const s = DB.services.find((x) => x.slug === slug);
    if (!s) return;
    currentService = s; selected.clear();
    document.querySelectorAll("#service-chips .chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.slug === slug)));
    renderServiceHead(); renderResults(); if (!silent) UI.toast(UI.t("cmp.toast.selected").replace("{x}", nameOf(s)));
  }

  // Filters
  const fCity = document.getElementById("f-city"), fType = document.getElementById("f-type"),
    fStatus = document.getElementById("f-status"), fMin = document.getElementById("f-min"),
    fMax = document.getElementById("f-max"), fSort = document.getElementById("f-sort");
  fCity.innerHTML = '<option value="">' + UI.t("hospitals.allcity") + "</option>" + DB.cities.map((c) => '<option value="' + Fmt.escapeHtml(c) + '">' + Fmt.escapeHtml(c) + "</option>").join("");
  fType.innerHTML = '<option value="">' + UI.t("cmp.all_types") + "</option>" + DB.hospitalTypes.map((t) => '<option value="' + Fmt.escapeHtml(t) + '">' + Fmt.escapeHtml(t) + "</option>").join("");
  [fCity, fType, fStatus, fSort].forEach((el) => el.addEventListener("change", renderResults));
  [fMin, fMax].forEach((el) => el.addEventListener("input", renderResults));
  document.getElementById("reset-filters").addEventListener("click", () => {
    fCity.value = fType.value = fStatus.value = fSort.value = ""; fMin.value = fMax.value = ""; fSort.value = "price-asc"; renderResults();
  });

  // Whole-bill estimate (selected service + chosen extra charges, private sector)
  const estState = { on: false, extras: [], days: 0 };
  const estToggle = document.getElementById("est-toggle");

  function hasPerDay() {
    return estState.extras.some((id) => { const x = DB.extraById(id); return x && x.type === "per_day"; });
  }
  function daysLabelHtml() {
    return Fmt.escapeHtml(UI.t("cmp.days.label")) + " (" +
      Fmt.escapeHtml(UI.t("sh.days_n")).replace("{n}", Fmt.bn(estState.days)) + ")";
  }
  function daysRow() {
    if (!hasPerDay()) return "";
    return '<div class="field mt-2" style="max-width:260px"><label for="cmp-days" id="cmp-days-label">' + daysLabelHtml() + "</label>" +
      '<input class="input" id="cmp-days" type="number" min="1" step="1" value="' + Fmt.escapeHtml(String(estState.days)) + '" style="min-height:44px"></div>';
  }
  function bindDays() {
    const inp = document.getElementById("cmp-days");
    if (!inp) return;
    inp.addEventListener("input", () => {
      const v = Math.max(1, Number(inp.value) || 0);
      estState.days = v;
      if (String(v) !== inp.value) inp.value = String(v);
      const lb = document.getElementById("cmp-days-label");
      if (lb) lb.innerHTML = daysLabelHtml();
      renderResults();
    });
  }
  function renderEstPanel(rebuild) {
    const panel = document.getElementById("est-panel");
    panel.hidden = !estState.on;
    if (estState.on) {
      if (rebuild) {
        const host = document.getElementById("cmp-extras");
        host.innerHTML = "";
        host.appendChild(UI.extrasPicker(estState.extras, (id, checked) => {
          if (checked) { if (estState.extras.indexOf(id) === -1) estState.extras.push(id); }
          else estState.extras = estState.extras.filter((x) => x !== id);
          // A per-day charge needs at least one day, so the input never contradicts the maths.
          if (hasPerDay() && estState.days < 1) estState.days = 1;
          renderEstPanel(false);
        }, { sector: "private" }));
        document.getElementById("est-badges").innerHTML = UI.sampleBadge();
      }
      document.getElementById("cmp-days-host").innerHTML = daysRow();
      bindDays();
      const hint = document.getElementById("est-hint");
      hint.hidden = estState.extras.length > 0;
      if (!hint.hidden) hint.textContent = UI.t("cmp.est.noextras");
    }
    renderResults();
  }
  function estFor(hospitalId) {
    const items = currentService ? [{ id: currentService.id, qty: 1 }] : [];
    return UI.computeEstimate(items, estState.extras, { hospitalId: hospitalId, sector: "private", days: estState.days });
  }
  // "তালিকাভুক্ত মূল্য" is the generic default basis; the line above already says exactly that.
  function basisSuffix(rec) {
    const b = rec.price_basis;
    if (!b || b === "তালিকাভুক্ত মূল্য") return "";
    return " · " + Fmt.escapeHtml(b);
  }
  estToggle.addEventListener("change", () => {
    estState.on = estToggle.checked;
    renderEstPanel(estState.on);
  });

  // Responsive two-column layout
  function applyLayout() {
    const wide = window.matchMedia("(min-width: 860px)").matches;
    document.getElementById("layout").style.gridTemplateColumns = wide ? "280px 1fr" : "1fr";
  }
  window.addEventListener("resize", applyLayout); applyLayout();

  function renderServiceHead() {
    const box = document.getElementById("service-head");
    if (!currentService) { box.style.display = "none"; return; }
    box.style.display = "block";
    const cat = DB.categoryById(currentService.category_id);
    const ps = DB.pricesForService(currentService.id);
    box.innerHTML =
      '<div class="row between items-center wrap gap-8">' +
        "<div><h2 style='font-size:20px;margin:0'>" + Fmt.escapeHtml(nameOf(currentService)) + "</h2>" +
        '<div class="small muted">' + Fmt.escapeHtml(nameAlt(currentService)) + " · " + Fmt.escapeHtml(cat ? nameOf(cat) : "") + " · " + Fmt.escapeHtml(currentService.unit || "") + "</div></div>" +
        '<div class="badge-row">' + UI.sampleBadge() + "</div>" +
      "</div>" +
      '<div class="small muted mt-2">' + UI.t("cmp.priced_count").replace("{x}", Fmt.bn(ps.length)) + "</div>";
  }

  function collectRows() {
    let recs = DB.prices.slice();
    if (currentService) recs = recs.filter((r) => r.service_id === currentService.id);
    recs = recs.filter((r) => r.verification_status !== "unavailable");
    recs = recs.map((r) => ({ rec: r, hosp: DB.hospitalById(r.hospital_id), svc: DB.serviceById(r.service_id) }));
    if (fCity.value) recs = recs.filter((x) => x.hosp.city === fCity.value);
    if (fType.value) recs = recs.filter((x) => x.hosp.hospital_type === fType.value);
    if (fStatus.value) recs = recs.filter((x) => x.rec.verification_status === fStatus.value);
    const lo = fMin.value ? Number(fMin.value) : null, hi = fMax.value ? Number(fMax.value) : null;
    const base = (r) => r.rec.price_amount != null ? r.rec.price_amount : (r.rec.price_min != null ? r.rec.price_min : (r.rec.price_max != null ? r.rec.price_max : Infinity));
    if (lo != null) recs = recs.filter((x) => base(x) >= lo);
    if (hi != null) recs = recs.filter((x) => base(x) <= hi);
    const sortKey = fSort.value;
    recs.sort((a, b) => {
      if (sortKey === "updated") return String(b.rec.last_checked_at || "").localeCompare(String(a.rec.last_checked_at || ""));
      const d = base(a) - base(b); return sortKey === "price-desc" ? -d : d;
    });
    return recs;
  }

  function renderGovtRef() {
    const el = document.getElementById("govt-ref");
    const g = currentService ? DB.govtService[currentService.id] : null;
    if (!g) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="card tight mt-3">' +
      '<h3 style="font-size:17px;margin:0">' + Fmt.escapeHtml(UI.t("cmp.govt.h")) + "</h3>" +
      '<div class="table-wrap"><table class="govt-cmp"><thead><tr><th>' + Fmt.escapeHtml(UI.t("cmp.th.service")) +
        "</th><th>" + Fmt.escapeHtml(UI.t("cmp.govt.th.range")) + '</th></tr></thead><tbody>' +
        "<tr><td style='white-space:normal'>" + Fmt.escapeHtml(nameOf(currentService)) + "</td>" +
        "<td><span class='price-range'>" + Fmt.escapeHtml(Fmt.taka(g[0]) + "–" + Fmt.taka(g[1])) + "</span></td></tr>" +
      "</tbody></table></div>" +
      '<div class="badge-row">' + UI.sampleBadge() + "</div>" +
      '<p class="small muted mt-2 mb-0">' + Fmt.escapeHtml(UI.t("sh.govt_note")) + " " + Fmt.escapeHtml(UI.t("cmp.govt.note")) + "</p>" +
    "</div>";
  }

  function renderResults() {
    renderGovtRef();
    const rows = collectRows();
    document.getElementById("result-meta").innerHTML =
      '<p class="small muted mb-0">' + UI.t("cmp.results_count").replace("{x}", Fmt.bn(rows.length)) + (currentService ? " — " + Fmt.escapeHtml(nameOf(currentService)) : "") + "</p>";
    const box = document.getElementById("results");
    if (!currentService) {
      box.innerHTML = '<div class="empty">' + UI.t("cmp.empty.pick") + "</div>"; updateCompareBar(); return;
    }
    if (!rows.length) {
      box.innerHTML = '<div class="empty">' + UI.t("cmp.empty.noprice") + "</div>"; updateCompareBar(); return;
    }
    box.innerHTML = rows.map((x, i) => {
      const key = x.rec.hospital_id + "|" + x.rec.service_id;
      const checked = selected.has(key) ? "checked" : "";
      const est = estState.on ? estFor(x.rec.hospital_id) : null;
      return '<div class="card tight">' +
        '<div class="row between items-center gap-8">' +
          "<div class='grow'><h3 style='font-size:17px;margin:0'>" + Fmt.escapeHtml(nameOf(x.hosp)) + "</h3>" +
          '<div class="kv small">' + UI.ICONS.pin + "<span>" + Fmt.escapeHtml(x.hosp.area) + ", " + Fmt.escapeHtml(x.hosp.city) + "</span></div></div>" +
          '<label class="check" style="padding:0"><input type="checkbox" data-key="' + Fmt.escapeHtml(key) + '" ' + checked + ' aria-label="তুলনার জন্য নির্বাচন"><span class="small muted">' + UI.t("nav.compare") + "</span></label>" +
        "</div>" +
        '<div class="row between items-center wrap gap-8 mt-2">' +
          "<div>" + (est
            ? '<span class="price lg">' + Fmt.escapeHtml(UI.bandText(est)) + "</span>" +
              '<div class="price-meta">' + Fmt.escapeHtml(UI.t("cmp.est.head")) + "</div>" +
              '<div class="small muted">' + Fmt.escapeHtml(UI.t("cmp.est.listed")) + ": " +
                Fmt.escapeHtml(Fmt.price(x.rec) || UI.t("label.price_na")) + basisSuffix(x.rec) + "</div>"
            : UI.priceText(x.rec) +
              '<div class="price-meta">' + Fmt.escapeHtml(x.rec.price_basis || "") + "</div>") + "</div>" +
          "<div>" + UI.statusBadge(x.rec) + "</div>" +
        "</div>" +
        '<div class="badge-row">' + UI.sampleBadge() + "</div>" +
        '<div class="small muted mt-2">' + Fmt.updated(x.rec.last_checked_at) + "</div>" +
        UI.staleNote(x.rec.last_checked_at) +
        UI.feedbackBtn(x.rec.hospital_id, x.rec.service_id) +
        '<div class="row gap-8 mt-2"><a class="btn sm secondary" href="hospital.html?slug=' + encodeURIComponent(x.hosp.slug) + '">' + UI.t("cmp.hospital_details") + "</a></div>" +
      "</div>";
    }).join("");
    box.querySelectorAll("input[type=checkbox][data-key]").forEach((cb) =>
      cb.addEventListener("change", () => { cb.checked ? selected.add(cb.dataset.key) : selected.delete(cb.dataset.key); updateCompareBar(); }));
    UI.bindFeedback(box);
    updateCompareBar();
  }

  function updateCompareBar() {
    const bar = document.getElementById("compare-bar");
    document.getElementById("cmp-count").textContent = Fmt.bn(selected.size);
    bar.classList.toggle("show", selected.size > 0);
  }
  document.getElementById("cmp-clear").addEventListener("click", () => { selected.clear(); renderResults(); });
  document.getElementById("cmp-show").addEventListener("click", showCompare);

  function showCompare() {
    if (selected.size < 2) { UI.toast(UI.t("cmp.need_two")); return; }
    const rows = collectRows().filter((x) => selected.has(x.rec.hospital_id + "|" + x.rec.service_id));
    // Do NOT label cheapest unless consistent basis: check all use same price_basis and are fixed amounts
    const bases = new Set(rows.map((r) => r.rec.price_basis));
    const allFixed = rows.every((r) => r.rec.price_amount != null);
    const canRank = bases.size === 1 && allFixed && rows.length >= 2;
    let cheapestId = null;
    if (canRank) cheapestId = rows.reduce((a, b) => (a.rec.price_amount <= b.rec.price_amount ? a : b)).rec.hospital_id;

    const body = document.getElementById("cmp-modal-body");
    const card = (r) => {
      const rec = r.rec;
      const est = estState.on ? estFor(rec.hospital_id) : null;
      return '<div class="card tight">' +
        '<div class="row between items-center gap-8"><h3 style="font-size:16px;margin:0">' + Fmt.escapeHtml(nameOf(r.hosp)) + "</h3>" +
        (cheapestId === rec.hospital_id ? '<span class="badge verified">' + UI.t("cmp.badge.cheapest") + "</span>" : "") + "</div>" +
        (est
          ? "<div class='mt-2'>" + Fmt.escapeHtml(UI.t("cmp.est.head")) + "</div>" +
            '<div class="price lg">' + Fmt.escapeHtml(UI.bandText(est)) + "</div>" +
            '<div class="small muted">' + Fmt.escapeHtml(UI.t("cmp.est.listed")) + ": " +
              Fmt.escapeHtml(Fmt.price(rec) || UI.t("label.price_na")) + "</div>"
          : "<div class='mt-2'>" + UI.priceText(rec) + "</div>") +
        '<dl class="small" style="margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px">' +
          "<dt class='muted'>" + UI.t("cmp.k.basis") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(rec.price_basis || "—") + "</dd>" +
          "<dt class='muted'>" + UI.t("cmp.k.included") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(rec.inclusions || "—") + "</dd>" +
          "<dt class='muted'>" + UI.t("cmp.k.excluded") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(rec.exclusions || "—") + "</dd>" +
          "<dt class='muted'>" + UI.t("cmp.k.status") + "</dt><dd style='margin:0'>" + UI.statusBadge(rec) + "</dd>" +
          "<dt class='muted'>" + UI.t("cmp.k.updated") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(Fmt.updated(rec.last_checked_at)) + "</dd>" +
        "</dl>" + UI.staleNote(rec.last_checked_at) +
        UI.feedbackBtn(rec.hospital_id, rec.service_id) + "</div>";
    };
    body.innerHTML =
      (canRank ? '<div class="notice mb-0">' + UI.t("cmp.notice.ranked") + "</div>"
        : '<div class="notice warn">' + UI.t("cmp.notice.warn") + "</div>") +
      '<div class="stack mt-3">' + rows.map(card).join("") + "</div>" +
      '<p class="small muted mt-3">' + UI.t("cmp.disclaimer") + "</p>" +
      '<div class="row gap-8 wrap"><a class="btn sm secondary" href="calculator.html">' + UI.t("home.cta.calc") + '</a><button class="btn sm ghost" type="button" data-close>' + UI.t("more.close") + "</button></div>";
    UI.bindFeedback(body);
    document.getElementById("cmp-modal").classList.add("open");
  }

  const modal = document.getElementById("cmp-modal");
  modal.addEventListener("click", (e) => { if (e.target === modal || e.target.closest("[data-close]")) modal.classList.remove("open"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") modal.classList.remove("open"); });

  if (currentService) {
    document.querySelectorAll("#service-chips .chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.slug === currentService.slug)));
  }
  renderServiceHead(); renderResults();
})();
</script>
</body>
</html>
