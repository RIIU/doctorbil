<script>/*db-theme-boot*/(function(){try{var t=localStorage.getItem("db_theme");var d=t==="dark";document.documentElement.setAttribute("data-theme",d?"dark":"light");var l=localStorage.getItem("db_lang");if(l==="en"||l==="bn")document.documentElement.setAttribute("lang",l);}catch(e){}})();</script>
<meta charset="UTF-8">

<meta property="og:description" content="হাসপাতালের ঠিকানা, মানচিত্র ও সেবাভিত্তিক তালিকাভুক্ত মূল্য দেখুন।">
<meta property="og:url" content="https://doctorbill-bd-6ikpiarwyxl.qoder.website/hospital.html">
<meta property="og:image" content="https://doctorbill-bd-6ikpiarwyxl.qoder.website/assets/img/icon.svg">

<link rel="icon" href="assets/img/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="hosp.skip">মূল কনটেন্টে যান</a>
<header id="site-header"></header>

<main id="main">
  <div class="container" id="crumb" style="padding-top:14px"></div>
  <section class="section" style="padding-top:8px"><div class="container" id="detail"></div></section>
</main>

<div class="modal-backdrop" id="price-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pm-title">
    <div class="modal-head"><h3 id="pm-title" class="mb-0" data-i18n="hosp.pm_title">মূল্যের বিস্তারিত</h3><button class="icon-btn" type="button" aria-label="বন্ধ করুন" data-close>✕</button></div>
    <div id="pm-body" class="mt-3"></div>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  UI.boot("hospitals");
  const slug = new URLSearchParams(location.search).get("slug");
  const hp = slug ? DB.resolveHospital(slug) : null;

  // Invalid or missing slug → honest not-found state (never silently render
  // another hospital: duplicate content + misleading prices).
  if (!hp) {
    document.title = (UI.isEn() ? "Hospital not found | DoctorBill" : "হাসপাতাল পাওয়া যায়নি | DoctorBill");
    document.getElementById("crumb").innerHTML =
      '<nav aria-label="breadcrumb"><ol class="small muted" style="list-style:none;display:flex;gap:6px;padding:0;margin:0;flex-wrap:wrap">' +
      '<li><a href="index.html">' + (UI.isEn() ? "Home" : "হোম") + '</a> ›</li><li aria-current="page" style="color:var(--text)">' + (UI.isEn() ? "Hospitals" : "হাসপাতাল") + '</li></ol></nav>';
    document.getElementById("detail").innerHTML =
      '<div class="card">' +
        '<div class="empty">' +
          "<h1 style=\"font-size:22px\">" + (UI.isEn() ? "Hospital not found" : "হাসপাতাল পাওয়া যায়নি") + "</h1>" +
          '<p class="muted">' + (UI.isEn() ? "The link may be wrong, or the record may have changed." : "লিঙ্কটি ভুল হতে পারে, বা রেকর্ডটি বদলে গিয়ে থাকতে পারে।") + '</p>' +
          '<div class="row gap-8 wrap" style="justify-content:center">' +
            '<a class="btn secondary" href="hospitals.html">' + (UI.isEn() ? "See all hospitals" : "সব হাসপাতাল দেখুন") + '</a>' +
            '<a class="btn secondary" href="compare.html">' + (UI.isEn() ? "Find a service" : "সেবা খুঁজুন") + '</a>' +
          "</div>" +
        "</div>" +
      "</div>";
    return;
  }

  document.title = (UI.isEn() && hp.name_en ? hp.name_en : hp.name_bn) + " | DoctorBill";
  // Per-slug canonical + Open Graph so each hospital gets its own shareable URL.
  const canonUrl = location.origin + location.pathname + "?slug=" + encodeURIComponent(slug);
  const canonEl = document.querySelector('link[rel="canonical"]');
  const ogUrlEl = document.querySelector('meta[property="og:url"]');
  const ogTitleEl = document.querySelector('meta[property="og:title"]');
  const ogDescEl = document.querySelector('meta[property="og:description"]');
  if (canonEl) canonEl.href = canonUrl;
  if (ogUrlEl) ogUrlEl.content = canonUrl;
  if (ogTitleEl) ogTitleEl.content = hp.name_bn + " | DoctorBill";
  if (ogDescEl) ogDescEl.content = hp.name_bn + (hp.is_directory
    ? " — " + (hp.area ? hp.area + ", " : "") + (hp.city || "")
    : " — " + (UI.isEn() ? "service-wise listed prices, address and contact info" : "সেবাভিত্তিক তালিকাভুক্ত মূল্য, ঠিকানা ও যোগাযোগ তথ্য"));

  document.getElementById("crumb").innerHTML =
    '<nav aria-label="breadcrumb"><ol class="small muted" style="list-style:none;display:flex;gap:6px;padding:0;margin:0;flex-wrap:wrap">' +
      '<li><a href="index.html">' + (UI.isEn() ? "Home" : "হোম") + '</a> ›</li><li><a href="hospitals.html">' + (UI.isEn() ? "Hospitals" : "হাসপাতাল") + '</a> ›</li>' +
      '<li aria-current="page" style="color:var(--text)">' + Fmt.escapeHtml(hp.name_bn) + "</li></ol></nav>";

  // Directory-only hospital: real name (from OpenStreetMap), no price records yet.
  const recs = DB.pricesForHospital(hp.id);
  const usable = recs.filter((r) => r.verification_status !== "unavailable");
  if (hp.is_directory && !usable.length) {
    document.getElementById("detail").innerHTML =
      '<div class="card">' +
        '<div class="hcard-head">' +
          '<div class="hcard-avatar" aria-hidden="true">' + Fmt.escapeHtml(hp.name_bn.slice(0, 1)) + "</div>" +
          "<div class='grow'><h1 style='font-size:24px;margin:0'>" + Fmt.escapeHtml(hp.name_bn) + "</h1>" +
          '<div class="small muted">' + Fmt.escapeHtml(hp.name_en || "") + "</div></div>" +
          UI.favBtn(hp.slug) +
        "</div>" +
        '<div class="badge-row mt-2"><span class="tag">' + Fmt.escapeHtml(UI.typeName(hp.hospital_type)) + "</span>" +
          '<span class="tag">' + Fmt.escapeHtml((hp.area ? hp.area + ", " : "") + (hp.city || "")) + "</span></div>" +
      "</div>" +
      '<div class="notice warn mt-3"><strong>' + (UI.isEn() ? "Info not added yet:" : "তথ্য এখনো যুক্ত হয়নি:") + '</strong> ' + (UI.isEn()
        ? "This hospital is listed to make it easy to find, but its verified prices, address or contact details have not been added to the platform yet. We do not show fake data."
        : "এই হাসপাতালটি খোঁজার সুবিধার্থে তালিকাভুক্ত, কিন্তু এর যাচাইকৃত মূল্য, ঠিকানা বা যোগাযোগের তথ্য এখনো প্ল্যাটফর্মে যোগ করা হয়নি। আমরা ভুয়া তথ্য দেখাই না।") + '</div>' +
      '<div class="card mt-3"><h3 style="font-size:17px">' + (UI.isEn() ? "Help add this hospital's information" : "এই হাসপাতালের তথ্য যুক্ত করতে সহায়তা করুন") + '</h3>' +
        '<p class="muted small">' + (UI.isEn() ? "If you have received treatment here, you can help verify price information by submitting a bill." : "আপনি এখানে চিকিৎসা নিলে বিল জমা দিয়ে মূল্য তথ্য যাচাইয়ে সহায়তা করতে পারেন।") + '</p>' +
        '<div class="row gap-8 wrap"><a class="btn" href="submit-bill.html">' + (UI.isEn() ? "Submit a bill" : "বিল জমা দিন") + '</a>' +
        '<a class="btn secondary" href="compare.html">' + (UI.isEn() ? "Compare prices at other hospitals" : "অন্য হাসপাতালের মূল্য তুলনা") + '</a>' +
        UI.directionsLink(hp) + "</div></div>";
    return;
  }

  const byCat = {};
  recs.forEach((r) => {
    const svc = DB.serviceById(r.service_id); if (!svc) return;
    (byCat[svc.category_id] = byCat[svc.category_id] || []).push({ rec: r, svc });
  });

  // Header
  const header =
    '<div class="card">' +
      '<div class="hcard-head">' +
        '<div class="hcard-avatar" aria-hidden="true">' + Fmt.escapeHtml((UI.isEn() && hp.name_en ? hp.name_en : hp.name_bn).slice(0, 1)) + "</div>" +
        "<div class='grow'><h1 style='font-size:24px;margin:0'>" + Fmt.escapeHtml(UI.isEn() && hp.name_en ? hp.name_en : hp.name_bn) + "</h1>" +
        '<div class="small muted">' + Fmt.escapeHtml(hp.name_en || "") + "</div></div>" +
        UI.favBtn(hp.slug) +
      "</div>" +
      '<div class="badge-row mt-2">' + UI.sampleBadge() + '<span class="tag">' + Fmt.escapeHtml(UI.typeName(hp.hospital_type)) + "</span>" +
        '<span class="badge unverified"><span class="dot"></span>' + (UI.isEn() ? "Verification pending" : "তথ্য যাচাই বাকি") + '</span></div>' +
      '<div class="stack mt-3">' +
        '<div class="kv">' + UI.ICONS.pin + "<span>" + Fmt.escapeHtml(hp.address_bn || (UI.isEn() ? "Address not added yet" : "ঠিকানা এখনো যুক্ত হয়নি")) + "</span></div>" +
        (hp.phone_masked ? '<div class="kv">' + UI.ICONS.phone + "<span>" + Fmt.escapeHtml(hp.phone_masked) + ' <span class="small muted">(' + (UI.isEn() ? "number listed on OpenStreetMap" : "OpenStreetMap-তালিকাভুক্ত নম্বর") + ')</span></span></div>' : "") +
        (hp.website ? '<div class="kv">🔗 <a href="' + Fmt.escapeHtml(hp.website) + '" rel="noopener">' + (UI.isEn() ? "Website" : "ওয়েবসাইট") + "</a></div>" : "") +
      "</div>" +
      '<div class="row gap-8 wrap mt-3">' +
        UI.directionsLink(hp) +
        '<a class="btn sm ghost" href="compare.html' + (hp.area ? '?area=' + encodeURIComponent(hp.area) : '') + '">' + (UI.isEn() ? "Compare prices" : "মূল্য তুলনা") + '</a>' +
      "</div>" +
    "</div>" +
    (hp.latitude && hp.longitude ? '<div class="mt-3">' + UI.miniMap([hp], { height: 220 }) + "</div>" : "");

  // Price list grouped by category
  let priceHtml = '<h2 class="mt-3" style="font-size:22px">' + (UI.isEn() ? "Price list" : "সেবার মূল্য তালিকা") + '</h2>';
  if (!usable.length) {
    priceHtml += '<div class="empty">' + (UI.isEn() ? "No listed prices for this hospital yet." : "এই হাসপাতালের জন্য এখনো কোনো তালিকাভুক্ত মূল্য নেই।") + '</div>';
  } else {
    priceHtml += '<p class="section-sub">' + (UI.isEn() ? "Select a service to see price details (what's included, source, date updated)." : "সেবা বেছে মূল্যের বিস্তারিত (কী অন্তর্ভুক্ত, উৎস, আপডেটের তারিখ) দেখুন।") + '</p>';
    Object.keys(byCat).forEach((cid) => {
      const cat = DB.categoryById(cid);
      priceHtml += '<h3 style="font-size:17px;margin-top:18px">' + Fmt.escapeHtml(cat ? (UI.isEn() && cat.name_en ? cat.name_en : cat.name_bn) : cid) + "</h3>";
      priceHtml += '<div class="card tight" style="padding:0"><div class="table-wrap"><table class="data">' +
        "<thead><tr><th>" + (UI.isEn() ? "Service" : "সেবা") + "</th><th>" + (UI.isEn() ? "Price" : "মূল্য") + "</th><th>" + (UI.isEn() ? "Status" : "অবস্থা") + "</th><th>" + (UI.isEn() ? "Updated" : "আপডেট") + "</th><th></th></tr></thead><tbody>";
      byCat[cid].forEach((row) => {
        const p = Fmt.price(row.rec, UI.isEn() ? "en" : "bn");
        priceHtml += "<tr>" +
          "<td style='white-space:normal;min-width:180px'>" + Fmt.escapeHtml(UI.isEn() && row.svc.name_en ? row.svc.name_en : row.svc.name_bn) + '<div class="small muted">' + Fmt.escapeHtml(UI.unitName(row.svc.unit || "")) + "</div></td>" +
          "<td>" + (p ? "<span class='price' style='font-size:18px'>" + p + "</span>" : '<span class="price-na">' + (UI.isEn() ? "Price unavailable" : "মূল্য পাওয়া যায়নি") + '</span>') + "</td>" +
          "<td>" + UI.statusBadge(row.rec) + "</td>" +
          "<td class='small muted'>" + Fmt.escapeHtml(Fmt.date(row.rec.last_checked_at) || "—") + "</td>" +
          "<td><button class='btn sm ghost' type='button' data-svc='" + row.svc.id + "'>" + (UI.isEn() ? "Details" : "বিস্তারিত") + "</button></td>" +
        "</tr>";
      });
      priceHtml += "</tbody></table></div></div>";
    });
  }

  // Info sections
  const info =
    '<div class="grid cols-2 mt-3">' +
      '<div class="card tight"><h3 style="font-size:17px">' + (UI.isEn() ? "About" : "পরিচিতি") + '</h3><p class="muted small mb-0">' + (hp.is_rate_card
        ? (UI.isEn()
          ? "This is the published rate list for government hospitals — not one specific hospital. Extra charges such as admission/medicine may apply separately."
          : "এটি সরকারি হাসপাতালের প্রকাশিত রেট তালিকা — কোনো নির্দিষ্ট একটি হাসপাতাল নয়। প্রবেশ/ওষুধ ইত্যাদির অতিরিক্ত খরচ আলাদা হতে পারে।")
        : Fmt.escapeHtml(UI.typeName(hp.hospital_type)) + (UI.isEn()
          ? " type, a real facility (listed on OpenStreetMap). No fabricated data is shown here."
          : " ধরনের আসল প্রতিষ্ঠান (OpenStreetMap-তালিকাভুক্ত)। এখানে কোনো বানানো তথ্য দেখানো হয় না।")) + '</p></div>' +
      '<div class="card tight"><h3 style="font-size:17px">' + (UI.isEn() ? "Available services" : "উপলব্ধ সেবা") + '</h3><p class="muted small mb-0">' + (UI.isEn() ? String(usable.length) + " services have listed prices. See the list above." : Fmt.bn(usable.length) + " টি সেবার তালিকাভুক্ত মূল্য আছে। উপরের তালিকা দেখুন।") + '</p></div>' +
      '<div class="card tight"><h3 style="font-size:17px">' + (UI.isEn() ? "Address & directions" : "ঠিকানা ও দিকনির্দেশনা") + '</h3><p class="muted small mb-0">' + (hp.is_rate_card
        ? (UI.isEn() ? "Applies to: any government hospital in Bangladesh at these fixed rates." : "প্রযোজ্য: বাংলাদেশের যেকোনো সরকারি হাসপাতালে এই নির্ধারিত রেট।")
        : Fmt.escapeHtml(hp.address_bn || (UI.isEn() ? "Address information not added yet" : "ঠিকানা তথ্য এখনো যুক্ত হয়নি"))) + '</p></div>' +
      '<div class="card tight" id="corrections"><h3 style="font-size:17px">' + (UI.isEn() ? "Report incorrect information" : "ভুল তথ্য সংশোধন") + '</h3><p class="muted small mb-0">' + (UI.isEn()
        ? 'If any price is wrong, let us know using the button below, or <a href="submit-bill.html">submit a bill</a>.'
        : 'কোনো মূল্য ভুল হলে নিচের বাটনে জানান, অথবা <a href="submit-bill.html">বিল জমা দিন</a>।') + '</p><button class="btn sm secondary mt-2" type="button" id="report-btn">' + (UI.isEn() ? "Report a wrong price" : "ভুল মূল্য জানান") + '</button></div>' +
    "</div>";

  document.getElementById("detail").innerHTML = header + priceHtml + info;

  document.getElementById("report-btn") && document.getElementById("report-btn").addEventListener("click", () => UI.toast(UI.isEn() ? "Thank you! The correction request was received." : "ধন্যবাদ! সংশোধনের অনুরোধ গ্রহণ করা হলো।"));

  // Price detail drawer
  const modal = document.getElementById("price-modal");
  document.getElementById("detail").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-svc]"); if (!b) return;
    const rec = recs.find((r) => r.service_id === b.dataset.svc);
    const svc = DB.serviceById(rec.service_id);
    document.getElementById("pm-body").innerHTML =
      "<h3 style='font-size:18px;margin:0'>" + Fmt.escapeHtml(svc.name_bn) + "</h3>" +
      '<div class="small muted">' + Fmt.escapeHtml(svc.name_en) + "</div>" +
      "<div class='mt-2'>" + UI.priceText(rec) + ' <span class="small muted">' + Fmt.escapeHtml(rec.price_basis || "") + "</span></div>" +
      '<div class="badge-row mt-2">' + UI.statusBadge(rec) + UI.sampleBadge() + "</div>" +
      '<dl class="small mt-3" style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0">' +
        "<dt class='muted'>" + (UI.isEn() ? "Included" : "অন্তর্ভুক্ত") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(rec.inclusions || "—") + "</dd>" +
        "<dt class='muted'>" + (UI.isEn() ? "Excluded / extra" : "বাদ/অতিরিক্ত") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(rec.exclusions || "—") + "</dd>" +
        "<dt class='muted'>" + (UI.isEn() ? "Source" : "উৎস") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(rec.source_type === "user_submission"
          ? (UI.isEn() ? "User submission" : "ব্যবহারকারীর জমা")
          : (UI.isEn() ? "Hospital-provided" : "হাসপাতাল-প্রদত্ত")) + "</dd>" +
        "<dt class='muted'>" + (UI.isEn() ? "Last updated" : "সর্বশেষ আপডেট") + "</dt><dd style='margin:0'>" + Fmt.escapeHtml(Fmt.date(rec.last_checked_at) || "—") + "</dd>" +
      "</dl>" +
      '<p class="small muted mt-3">' + (UI.isEn() ? "The final bill may add consultation fees, taxes and charges for extra services." : "চূড়ান্ত বিলে পরামর্শ ফি, ট্যাক্স ও অতিরিক্ত সেবার খরচ যুক্ত হতে পারে।") + '</p>' +
      '<div class="row gap-8 wrap"><button class="btn sm secondary" type="button" id="pm-report">' + (UI.isEn() ? "Report a wrong price" : "ভুল মূল্য জানান") + '</button>' +
      '<a class="btn sm ghost" href="compare.html?service=' + encodeURIComponent(svc.slug) + '">' + (UI.isEn() ? "Compare at other hospitals" : "অন্য হাসপাতালে তুলনা") + '</a></div>';
    modal.classList.add("open");
    UI.openModal(modal);
    document.getElementById("pm-report").addEventListener("click", () => { UI.closeModal(modal); UI.toast(UI.isEn() ? "The correction request was received." : "সংশোধনের অনুরোধ গ্রহণ করা হলো।"); });
  });
  modal.addEventListener("click", (e) => { if (e.target === modal || e.target.closest("[data-close]")) UI.closeModal(modal); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) UI.closeModal(modal); });

  // Real data (OSM hospitals / approved bills) can arrive after first render.
  // If this slug resolved to nothing initially, reload once when it shows up.
  if (!hp) {
    window.addEventListener("db:realdata", function () {
      if (slug && DB.resolveHospital(slug)) location.reload();
    });
  }
})();
</script>
</body>
</html>
